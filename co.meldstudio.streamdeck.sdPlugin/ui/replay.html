<html>

<head>
    <meta charset="utf-8" />
    <title>co.meldstudio.streamdeck.replay Property Inspector</title>
    <link rel="stylesheet" href="../libs/css/sdpi.css">
</head>

<body>
    <div class="sdpi-wrapper">
        <div class="sdpi-item">
            <div class="sdpi-item-label">Action</div>
            <select class="sdpi-item-value select" id="action">
                <option value="replay">Show Replay</option>
                <option value="dismiss">Dismiss</option>
                <option value="toggle">Toggle Mute</option>
                <option value="mute">Mute</option>
                <option value="unmute">Unmute</option>
                <option value="toggle_cue">Toggle Cue</option>
                <option value="cue">Cue</option>
                <option value="uncue">Uncue</option>
                <option value="volume_up">Volume Up</option>
                <option value="volume_down">Volume Down</option>
            </select>
        </div>

        <div class="sdpi-item" id="loading" style="display: none;">
            <div class="sdpi-connecting">Connecting to Meld Studio...</div>
        </div>
    </div>

    <script src="lib/meld-pi.js"></script>
    <script>
        MeldPI.onReady(() => {
            MeldPI.watchConnection("loading");
            MeldPI.bindField("action", "replay");
        });
    </script>
</body>

</html>
