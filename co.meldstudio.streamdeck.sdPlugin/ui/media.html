<html>

<head>
    <meta charset="utf-8" />
    <title>co.meldstudio.streamdeck.media Property Inspector</title>
    <link rel="stylesheet" href="../libs/css/sdpi.css">
</head>

<body>
    <div class="sdpi-wrapper">
        <div class="sdpi-item">
            <div class="sdpi-item-label">Scene</div>
            <select class="sdpi-item-value select" id="scene" disabled></select>
        </div>
        <div class="sdpi-item">
            <div class="sdpi-item-label">Layer</div>
            <select class="sdpi-item-value select" id="layer" disabled></select>
        </div>
        <div class="sdpi-item">
            <div class="sdpi-item-label">Action</div>
            <select class="sdpi-item-value select" id="action">
                <option value="toggle">Toggle Play/Pause</option>
                <option value="play">Play</option>
                <option value="pause">Pause</option>
                <option value="restart">Restart</option>
            </select>
        </div>

        <div class="sdpi-item" id="loading" style="display: none;">
            <div class="sdpi-connecting">Connecting to Meld Studio...</div>
        </div>
    </div>

    <script src="lib/meld-pi.js"></script>
    <script>
        MeldPI.onReady(() => {
            MeldPI.watchConnection("loading");
            // Only scenes that are not vertical, and only layers that have a media source.
            MeldPI.bindSessionSelects(["scene", "layer"], (type, item) => {
                if (type === "layer") {
                    return Object.prototype.hasOwnProperty.call(item, "mediaSource");
                }
                if (type === "scene") {
                    return !item.vertical;
                }
                return true;
            });
            MeldPI.bindField("action", "toggle");
        });
    </script>
</body>

</html>
