<html>

<head>
    <meta charset="utf-8" />
    <title>co.meldstudio.streamdeck.volume-stepper Property Inspector</title>
    <link rel="stylesheet" href="../libs/css/sdpi.css">
</head>

<body>
    <div class="sdpi-wrapper">
        <div class="sdpi-item">
            <div class="sdpi-item-label">Track</div>
            <select class="sdpi-item-value select" id="track"></select>
        </div>
        <div class="sdpi-item">
            <div class="sdpi-item-label">StepSize</div>
            <input type="number" class="sdpi-item-value" id="stepsize" value="1" />
        </div>
        <div class="sdpi-item">
            <div class="sdpi-item-label">Meter</div>
            <select class="sdpi-item-value select" id="metertype">
                <option value="percent">Percent</option>
                <option value="db">Decibels</option>
            </select>
        </div>

        <div class="sdpi-item" id="loading" style="display: none;">
            <div class="sdpi-connecting">Connecting to Meld Studio...</div>
        </div>
    </div>

    <script src="lib/meld-pi.js"></script>
    <script>
        MeldPI.onReady(() => {
            MeldPI.watchConnection("loading");
            MeldPI.bindSessionSelects(["track"]);
            MeldPI.bindField("stepsize", "1");
            MeldPI.bindField("metertype", "db");
        });
    </script>
</body>

</html>
