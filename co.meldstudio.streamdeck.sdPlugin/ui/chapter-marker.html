<html>

<head>
    <meta charset="utf-8" />
    <title>co.meldstudio.streamdeck.chapter-marker Property Inspector</title>
    <link rel="stylesheet" href="../libs/css/sdpi.css">
</head>

<body>
    <div class="sdpi-wrapper">
        <div class="sdpi-item">
            <details class="message info">
                <summary>Adds a chapter marker to every active recording at the moment the key is pressed.</summary>
                <p>Markers are embedded in the recording file. Meld Studio ignores the press while nothing is
                    recording, and the key dims to show that.</p>
            </details>
        </div>

        <div class="sdpi-item" id="loading" style="display: none;">
            <div class="sdpi-connecting">Connecting to Meld Studio...</div>
        </div>
    </div>

    <script src="lib/meld-pi.js"></script>
    <script>
        MeldPI.onReady(() => {
            MeldPI.watchConnection("loading");
        });
    </script>
</body>

</html>
